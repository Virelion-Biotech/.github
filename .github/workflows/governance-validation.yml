name: Governance validation

on:
  push:
    paths:
      - "governance/**"
      - ".github/workflows/governance-validation.yml"
  pull_request:
    paths:
      - "governance/**"
      - ".github/workflows/governance-validation.yml"

permissions:
  contents: read

jobs:
  validate-governance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate shell syntax
        run: bash -n governance/apply-main-rulesets.sh governance/enable-security-features.sh
      - name: Validate ruleset template JSON
        run: |
          jq -e '
            . as $payload |
            $payload.target == "branch" and
            $payload.conditions.ref_name.include == ["~DEFAULT_BRANCH"] and
            ([$payload.rules[].type] | index("deletion") != null) and
            ([$payload.rules[].type] | index("non_fast_forward") != null) and
            ([$payload.rules[].type] | index("pull_request") != null) and
            ([$payload.rules[].type] | index("required_status_checks") != null) and
            ($payload.rules[] | select(.type == "pull_request").parameters.allowed_merge_methods == ["merge", "squash", "rebase"]) and
            ($payload.rules[] | select(.type == "required_status_checks").parameters.required_status_checks | length > 0)
          ' governance/ruleset-template.json >/dev/null
      - name: Reject organization-only conditions in repository ruleset payload
        run: |
          if grep -n "repository_name:" governance/apply-main-rulesets.sh governance/ruleset-template.json; then
            echo "Repository-level rulesets must not use the organization-only repository_name condition."
            exit 1
          fi
      - name: Guard read-only workflow discovery methods
        run: |
          grep -Fq 'gh api --method GET "repos/${ORG}/${repository}/actions/runs"' governance/apply-main-rulesets.sh
          grep -Fq 'gh api --method GET "repos/${ORG}/${repository}/actions/runs/${run_id}/jobs"' governance/apply-main-rulesets.sh
